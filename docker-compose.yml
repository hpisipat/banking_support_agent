services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ORS_API_KEY: ${ORS_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    depends_on:
      - api
    environment:
      BANKING_AGENT_API_URL: http://api:8000
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
